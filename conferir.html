<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conferir assinatura · Supermercado Santa Rita</title>
<meta name="theme-color" content="#157a35">
<style>
  :root{
    --green:#157a35; --green-deep:#0c5a26; --green-soft:#e6f4ea; --green-line:#bfe0c9;
    --ink:#233; --muted:#5c6773; --faint:#8a97a4;
    --line:#e2e8ee; --bg:#eef1f4; --card:#fff;
    --err:#c0392b; --err-soft:#fbeae7; --err-line:#f0c8c1;
    --warn:#7a5a00; --warn-soft:#fbf4e2; --warn-line:#e8dbb4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(150deg,var(--green),var(--green-deep));color:#fff;padding:26px 22px 26px}
  .cart{line-height:0}
  .cart svg{width:32px;height:32px;display:block;stroke:#fff}
  header h1{margin:9px 0 3px;font-size:21px;letter-spacing:-.2px}
  header p{margin:0;font-size:13px;opacity:.92}
  main{background:var(--card);flex:1;padding:22px 18px 32px;border-radius:18px 18px 0 0;margin-top:-14px}
  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:7px}
  input{width:100%;border:1px solid var(--line);background:#f8fafb;border-radius:11px;padding:14px 13px;font-size:19px;color:var(--ink);
        font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase}
  input:focus{outline:none;border-color:var(--green);background:#fff}
  .dica{font-size:12px;color:var(--faint);margin:7px 2px 0;text-align:center}
  button{width:100%;margin-top:16px;border:0;background:var(--green);color:#fff;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  button:hover{background:var(--green-deep)}
  button:disabled{opacity:.6;cursor:default}
  .res{margin-top:22px;border-radius:13px;padding:17px 16px;border:1px solid var(--line);display:none}
  .res.on{display:block}
  .res .tit{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;margin-bottom:4px}
  .res .sub{font-size:13px;margin:0 0 14px}
  .res.ok{background:var(--green-soft);border-color:var(--green-line);color:#14502a}
  .res.mudou{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
  .res.nao{background:var(--err-soft);border-color:var(--err-line);color:#8c2318}
  .lin{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid rgba(0,0,0,.08);font-size:13.5px}
  .lin .k{color:inherit;opacity:.75}
  .lin .v{font-weight:700;text-align:right}
  .lin .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em}
  .rod{padding:20px 22px 30px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.6}
  @media(prefers-color-scheme:dark){
    :root{--bg:#0f1115;--card:#171a1f;--ink:#e9edf2;--muted:#9aa5b1;--faint:#7c8794;--line:#2a2f36;
          --green-soft:#18241a;--green-line:#2c4231;--err-soft:#251614;--err-line:#4a2620;--warn-soft:#241e10;--warn-line:#413516;}
    input{background:#12161c}
    .res.ok{color:#8ad69f}.res.nao{color:#e0776b}.res.mudou{color:#d9b568}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="cart">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    </div>
    <h1>Conferir assinatura</h1>
    <p>Digite o código impresso no contrato para ver se ele é verdadeiro.</p>
  </header>

  <main>
    <label for="cod">Código do contrato</label>
    <input id="cod" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="19" inputmode="latin">
    <p class="dica">Fica no rodapé do contrato, embaixo das assinaturas.</p>
    <button id="btn" type="button">Conferir</button>
    <div id="res" class="res"></div>
  </main>

  <div class="rod">
    Supermercado Santa Rita &middot; G Joao dos Santos Indústria e Comércio Ltda<br>
    Esta página apenas confere códigos. Nenhum dado é alterado aqui.
  </div>
</div>

<script>
// Sem biblioteca de fora: uma chamada só, com fetch puro. A página que prova
// autenticidade não pode depender de um script baixado de outro domínio.
var SUPA="https://uabhsmculsfwzcrhyhch.supabase.co";
var CHAVE="sb_publishable_IPLbRjk89c666QkfcoVTiw_GXujUTZU";
function rpcConferir(codigo){
  return fetch(SUPA+"/rest/v1/rpc/conferir_assinatura",{
    method:"POST",
    headers:{"apikey":CHAVE,"Authorization":"Bearer "+CHAVE,"Content-Type":"application/json"},
    body:JSON.stringify({p_codigo:codigo})
  }).then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("http "+r.status)); });
}
var cod=document.getElementById("cod"), btn=document.getElementById("btn"), res=document.getElementById("res");

function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function brl(v){ return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function dataBR(s){
  if(!s) return "—";
  var t=String(s);
  // com hora (assinatura, gravada em UTC): converte para o horário daqui, igual ao painel.
  // Sem isso a página mostraria 14h32 e o contrato impresso 11h32 — pareceria documento falso.
  if(t.indexOf("T")>0){
    var d=new Date(t.slice(-1)==="Z"?t:(t+"Z"));
    if(!isNaN(d.getTime())){
      var p=function(n){ return ("0"+n).slice(-2); };
      return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" às "+p(d.getHours())+"h"+p(d.getMinutes());
    }
  }
  // data pura (abertura/vencimento): sem fuso, mostra como está gravada
  var m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3]+"/"+m[2]+"/"+m[1]) : esc(t);
}
function fmtDoc(d){
  var n=String(d||"").replace(/\D/g,"");
  if(n.length===14) return n.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5");
  if(n.length===11) return n.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,"$1.$2.$3-$4");
  return d||"";
}
function lin(k,v,mono){ return '<div class="lin"><span class="k">'+k+'</span><span class="v'+(mono?" mono":"")+'">'+v+'</span></div>'; }

// vai formatando XXXX-XXXX-XXXX-XXXX enquanto digita
cod.addEventListener("input",function(){
  var v=cod.value.toUpperCase().replace(/[^0-9A-F]/g,"").slice(0,16), out=[];
  for(var i=0;i<v.length;i+=4) out.push(v.slice(i,i+4));
  cod.value=out.join("-");
});
cod.addEventListener("keydown",function(e){ if(e.key==="Enter") conferir(); });
btn.addEventListener("click",conferir);

function mostrar(classe,ico,titulo,sub,corpo){
  res.className="res on "+classe;
  res.innerHTML='<div class="tit">'+ico+" "+titulo+'</div><p class="sub">'+sub+"</p>"+(corpo||"");
}

function conferir(){
  var v=cod.value.replace(/[^0-9A-Fa-f]/g,"");
  if(v.length!==16){
    mostrar("nao","✕","Código incompleto","O código tem 16 caracteres, no formato XXXX-XXXX-XXXX-XXXX.");
    return;
  }
  btn.disabled=true; btn.textContent="Conferindo…";
  rpcConferir(cod.value).then(function(d){
    btn.disabled=false; btn.textContent="Conferir";
    if(!d||!d.achou){
      mostrar("nao","✕","Código não encontrado",
        "Nenhum contrato do Supermercado Santa Rita foi assinado com esse código. Confira se digitou certo — se estiver certo, <b>este documento não é autêntico</b>.");
      return;
    }
    var x=d.dados||{};
    var nome=(x.razao_social&&String(x.razao_social).trim())?x.razao_social:x.fornecedor;
    var dados=
      lin("Ponto extra","nº "+esc(x.numero))+
      lin("Contratante",esc(nome||"—"))+
      (x.cnpj?lin("CNPJ / CPF",esc(fmtDoc(x.cnpj)),true):"")+
      (x.vendedor?lin("Vendedor(a)",esc(x.vendedor)):"")+
      (x.endereco?lin("Endereço",esc(x.endereco)):"")+
      lin("Valor mensal",brl(x.valor_mensal))+
      lin("Valor total",brl(x.valor_total)+" ("+esc(x.meses)+(String(x.meses)==="1"?" mês)":" meses)"))+
      (x.pagamento?lin("Pagamento",esc(x.pagamento)):"")+
      lin("Período",dataBR(x.abertura)+" a "+dataBR(x.vencimento))+
      lin("Assinado por",esc(d.diretor||"—"))+
      lin("Assinado em",dataBR(d.assinado_em))+
      lin("Código",esc(d.codigo),true);
    if(d.atual){
      mostrar("ok","✓","Assinatura autêntica",
        "Este código foi gerado pelo Supermercado Santa Rita. Abaixo está exatamente <b>o que foi assinado</b> — confira campo por campo com o papel que você tem em mãos. Se algum não bater, o documento foi adulterado.",dados);
    }else if(d.sumiu){
      mostrar("mudou","⚠","Assinatura autêntica, cadastro removido",
        "O código é verdadeiro e estes são os dados assinados. O registro deste ponto extra já não existe no sistema da loja — o documento continua válido, mas fale com o Supermercado Santa Rita.",dados);
    }else{
      mostrar("mudou","⚠","Assinatura autêntica, cadastro alterado depois",
        "O código é verdadeiro e abaixo está <b>o que foi assinado</b>. O cadastro deste ponto extra mudou depois da assinatura — se o papel na sua mão disser algo diferente do que está aqui, <b>não considere válido</b>.",dados);
    }
  }).catch(function(){
    btn.disabled=false; btn.textContent="Conferir";
    mostrar("nao","!","Não deu para conferir agora","Sem resposta do sistema. Tente de novo em alguns segundos.");
  });
}

// aceita link direto: conferir.html?c=XXXX-XXXX-XXXX-XXXX
(function(){
  var m=location.search.match(/[?&]c=([^&]+)/);
  if(m){ cod.value=decodeURIComponent(m[1]).toUpperCase(); cod.dispatchEvent(new Event("input")); conferir(); }
})();
</script>
</body>
</html>
